name: Release

on:
  workflow_dispatch:

jobs:
  check-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.check-versions.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check latest version
        id: check-versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_version=$(yq .version ./charts/openbao/Chart.yaml)
          url="https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/openbao-helm/releases/latest"
          latest_version=$(curl -sSfL -H "Authorization: Bearer ${GITHUB_TOKEN}" "$url" | jq -r '.tag_name' | sed 's/openbao-//')

          if [ "$current_version" != "$latest_version" ]; then
            echo "should_release=true"  >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check-versions
    if: needs.check-versions.outputs.should_release == 'true'
    environment: helm-release
    permissions:
      contents: write
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    env:
      GPG_SIGNING_SUBKEY: ${{ vars.GPG_SIGNING_SUBKEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: GPG Import
        id: gpg-import
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSWORD }}
          fingerprint: ${{ vars.GPG_SIGNING_SUBKEY }}

      # Helm doesn't support signing charts with a specific GPG subkey directly. Manually create
      # the same provenance format `helm package --sign` produces so it can be signed using GPG
      # and the correct signing subkey.
      - name: Package and sign charts
        run: |
          rm -rf .cr-release-packages
          mkdir -p .cr-release-packages

          for chart in charts/*/; do
            helm package "$chart" --destination .cr-release-packages
          done

          pubring="${RUNNER_TEMP}/pubring.gpg"
          gpg --batch --export "$GPG_SIGNING_SUBKEY" > "$pubring"

          cd .cr-release-packages
          for pkg in *.tgz; do
            body="${RUNNER_TEMP}/${pkg}.prov-body"
            {
              helm show chart "$pkg"
              echo "..."
              printf 'files:\n  %s: sha256:%s\n' "$pkg" "$(sha256sum "$pkg" | cut -d' ' -f1)"
            } > "$body"

            # The trailing "!" forces gpg to use exactly this subkey.
            gpg --batch --yes --digest-algo SHA512 \
              --local-user "${GPG_SIGNING_SUBKEY}!" \
              --clearsign --output "${pkg}.prov" "$body"
            rm -f "$body"

            helm verify "$pkg" --keyring "$pubring"
          done

      - name: Run chart-releaser
        id: helm-release
        uses: helm/chart-releaser-action@92c6b97fa9f664492a2592e0d1d80bc6bf378957 # v1.9.0
        with:
          skip_packaging: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_GENERATE_RELEASE_NOTES: true

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Push Helm chart to GHCR as OCI artifact and sign with Cosign
        run: |
          chart_registry="ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
          for pkg in .cr-release-packages/*.tgz; do
            if [ -z "${pkg:-}" ]; then
              break
            fi

            push_output="$(helm push "${pkg}" "oci://${chart_registry}" 2>&1 | tee /dev/stderr)"
            digest="$(echo "${push_output}" | grep -oE 'sha256:[0-9a-f]{64}')"
            chart_name="$(basename "${pkg}" .tgz | cut -d'-' -f1)"

            cosign sign --yes "${chart_registry}/${chart_name}@${digest}"
          done

  ocm:
    permissions:
      packages: write
    needs:
      - release
    name: Release OCM Artifact
    uses: ./.github/workflows/job-ocm.yaml
    secrets: inherit
