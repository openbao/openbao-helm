name: Release

on:
  workflow_dispatch:

jobs:
  check-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.check-versions.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check latest version
        id: check-versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_version=$(yq .version ./charts/openbao/Chart.yaml)
          url="https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/openbao-helm/releases/latest"
          latest_version=$(curl -sSfL -H "Authorization: Bearer ${GITHUB_TOKEN}" "$url" | jq -r '.tag_name' | sed 's/openbao-//')

          if [ "$current_version" != "$latest_version" ]; then
            echo "should_release=true"  >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check-versions
    if: needs.check-versions.outputs.should_release == 'true'
    environment: helm-release
    permissions:
      contents: write
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Import PGP Private Key
        if: ${{ env.GPG_KEY && env.GPG_PASSPHRASE }}
        env:
          GPG_KEY: ${{ secrets.PGP_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.PGP_KEY_PASSPHRASE }}
        run: |
          echo "${{ secrets.PGP_PRIVATE_KEY }}" | gpg --dearmor --output /tmp/keyring.gpg
          echo "${{ secrets.PGP_KEY_PASSPHRASE }}" > /tmp/passphrase-file.txt

      - name: Run chart-releaser
        id: helm-release
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_GENERATE_RELEASE_NOTES: true
          CR_KEY: helm-charts+no-reply@openbao.org
          CR_KEYRING: /tmp/keyring.gpg
          CR_PASSPHRASE_FILE: /tmp/passphrase-file.txt
          CR_SIGN: ${{ secrets.PGP_PRIVATE_KEY != '' }}

      - name: Securely delete the PGP key and passphrase
        if: always()
        run: shred -f --remove=wipesync /tmp/keyring.gpg /tmp/passphrase-file.txt 2>/dev/null || true

      - name: Login to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Push Helm chart to GHCR as OCI artifact and sign with Cosign
        run: |
          chart_registry="ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
          for pkg in .cr-release-packages/*.tgz; do
            if [ -z "${pkg:-}" ]; then
              break
            fi

            push_output="$(helm push "${pkg}" "oci://${chart_registry}" 2>&1 | tee /dev/stderr)"
            digest="$(echo "${push_output}" | grep -oE 'sha256:[0-9a-f]{64}')"
            chart_name="$(basename "${pkg}" .tgz | sed -E 's/-[0-9]+\.[0-9]+\.[0-9]+.*$//')"

            cosign sign --yes "${chart_registry}/${chart_name}@${digest}"
          done

  ocm:
    permissions:
      packages: write
      id-token: write
    needs:
      - release
    name: Release OCM Artifact
    uses: ./.github/workflows/job-ocm.yaml
    secrets: inherit
