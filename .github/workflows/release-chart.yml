name: Release

on:
  workflow_dispatch:

jobs:
  check-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.check-versions.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check latest version
        id: check-versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_version=$(yq .version ./charts/openbao/Chart.yaml)
          url="https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/openbao-helm/releases/latest"
          latest_version=$(curl -sSfL -H "Authorization: Bearer ${GITHUB_TOKEN}" "$url" | jq -r '.tag_name' | sed 's/openbao-//')

          if [ "$current_version" != "$latest_version" ]; then
            echo "should_release=true"  >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check-versions
    if: needs.check-versions.outputs.should_release == 'true'
    environment: helm-release
    permissions:
      contents: write
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: GPG Import
        if: ${{ env.GPG_KEY && env.GPG_PASSWORD }}
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
        run: |
          keyring="${{ runner.temp }}/secring.gpg"
          passphrase_file="${{ runner.temp }}/passphrase"

          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --dearmor --output "$keyring"
          echo "${{ secrets.GPG_PASSWORD }}" > "$passphrase_file"

          echo "CR_KEYRING=${keyring}" >> "$GITHUB_ENV"
          echo "CR_PASSPHRASE_FILE=${passphrase_file}" >> "$GITHUB_ENV"

      - name: Run chart-releaser
        id: helm-release
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_GENERATE_RELEASE_NOTES: true
          CR_KEY: openbao@lists.lfedge.org
          CR_KEYRING: ${{ env.CR_KEYRING }}
          CR_PASSPHRASE_FILE: ${{ env.CR_PASSPHRASE_FILE }}
          CR_SIGN: ${{ secrets.GPG_PRIVATE_KEY != '' }}

      - name: Securely delete the GPG key and passphrase
        if: always()
        run: shred -f --remove=wipesync ${{ env.CR_KEYRING }} ${{ env.CR_PASSPHRASE_FILE }} 2>/dev/null || true

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Push Helm chart to GHCR as OCI artifact and sign with Cosign
        run: |
          chart_registry="ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
          for pkg in .cr-release-packages/*.tgz; do
            if [ -z "${pkg:-}" ]; then
              break
            fi

            push_output="$(helm push "${pkg}" "oci://${chart_registry}" 2>&1 | tee /dev/stderr)"
            digest="$(echo "${push_output}" | grep -oE 'sha256:[0-9a-f]{64}')"
            chart_name="$(basename "${pkg}" .tgz | cut -d'-' -f1)"

            cosign sign --yes "${chart_registry}/${chart_name}@${digest}"
          done

  ocm:
    permissions:
      packages: write
    needs:
      - release
    name: Release OCM Artifact
    uses: ./.github/workflows/job-ocm.yaml
    secrets: inherit
