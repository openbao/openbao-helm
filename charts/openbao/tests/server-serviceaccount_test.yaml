suite: OpenBao Server Serviceaccount Test
templates:
  - templates/server-serviceaccount.yaml
  - templates/server-service.yaml
release:
  name: "release-name"
  namespace: "default"
tests:
  - it: "server/ServiceAccount: specify service account name (case 1)"
    template: templates/server-serviceaccount.yaml
    set:
      server.dev.enabled: true
      server.serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: "server/ServiceAccount: specify service account name (case 2)"
    template: templates/server-serviceaccount.yaml
    set:
      server.dev.enabled: true
      server.serviceAccount.name: "user-defined-ksa"
    asserts:
      - equal:
          path: metadata.name
          value: "user-defined-ksa"

  - it: "server/ServiceAccount: specify service account name (case 3)"
    template: templates/server-serviceaccount.yaml
    set:
      server.dev.enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: "release-name-openbao"

  - it: "server/ServiceAccount: namespace (case 1)"
    template: templates/server-serviceaccount.yaml
    release:
      namespace: "foo"
    set:
      server.serviceAccount.create: true
    asserts:
      - equal:
          path: metadata.namespace
          value: "foo"

  - it: "server/ServiceAccount: namespace (case 2)"
    template: templates/server-serviceaccount.yaml
    release:
      namespace: "foo"
    set:
      server.serviceAccount.create: true
      global.namespace: "bar"
    asserts:
      - equal:
          path: metadata.namespace
          value: "bar"

  - it: "server/ServiceAccount: specify annotations (case 1)"
    template: templates/server-serviceaccount.yaml
    set:
      server.dev.enabled: true
      server.serviceAccount.annotations: "foo: bar"
    asserts:
      - isNull:
          path: metadata.annotations["foo"]

  - it: "server/ServiceAccount: specify annotations (case 2)"
    template: templates/server-serviceaccount.yaml
    set:
      server.ha.enabled: true
      server.serviceAccount.annotations: "foo: bar"
    asserts:
      - equal:
          path: metadata.annotations["foo"]
          value: "bar"

  - it: "server/ServiceAccount: specify annotations (case 3)"
    template: templates/server-serviceaccount.yaml
    set:
      server.ha.enabled: true
      server.serviceAccount.annotations.foo: "bar"
    asserts:
      - equal:
          path: metadata.annotations["foo"]
          value: "bar"

  - it: "server/ServiceAccount: specify annotations (case 4)"
    template: templates/server-serviceaccount.yaml
    set:
      server.ha.enabled: true
    asserts:
      - isNull:
          path: metadata.annotations["foo"]

  - it: "server/ServiceAccount: disable with global.enabled false (case 1)"
    template: templates/server-service.yaml
    set:
      server.dev.enabled: true
      global.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: "server/ServiceAccount: disable with global.enabled false (case 2)"
    template: templates/server-service.yaml
    set:
      server.ha.enabled: true
      global.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: "server/ServiceAccount: disable with global.enabled false (case 3)"
    template: templates/server-service.yaml
    set:
      server.standalone.enabled: true
      global.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: "server/ServiceAccount: disable by global.externalVaultAddr (case 1)"
    template: templates/server-service.yaml
    set:
      server.dev.enabled: true
      global.externalVaultAddr: "http://openbao-outside"
    asserts:
      - hasDocuments:
          count: 0

  - it: "server/ServiceAccount: disable by global.externalVaultAddr (case 2)"
    template: templates/server-service.yaml
    set:
      server.ha.enabled: true
      global.externalVaultAddr: "http://openbao-outside"
    asserts:
      - hasDocuments:
          count: 0

  - it: "server/ServiceAccount: disable by global.externalVaultAddr (case 3)"
    template: templates/server-service.yaml
    set:
      server.standalone.enabled: true
      global.externalVaultAddr: "http://openbao-outside"
    asserts:
      - hasDocuments:
          count: 0

  - it: "server/serviceAccount: specify server.serviceAccount.extraLabels"
    template: templates/server-serviceaccount.yaml
    set:
      server.serviceAccount.extraLabels.foo: "bar"
    asserts:
      - equal:
          path: metadata.labels.foo
          value: "bar"
