suite: OpenBao Server Ha Disruptionbudget Test
templates:
  - templates/server-disruptionbudget.yaml
release:
  name: "release-name"
  namespace: "default"
tests:
  - it: "server/DisruptionBudget: enabled by default"
    set:
      server.ha.enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: "server/DisruptionBudget: disable with server.enabled"
    set:
      global.enabled: false
      server.ha.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: "server/DisruptionBudget: disable with server.disruptionBudget.enabled"
    set:
      server.ha.disruptionBudget.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: "server/DisruptionBudget: disable with global.enabled"
    set:
      global.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: "server/DisruptionBudget: disable with injector.exernalVaultAddr"
    set:
      injector.externalVaultAddr: "http://openbao-outside"
    asserts:
      - hasDocuments:
          count: 0

  - it: "server/DisruptionBudget: namespace (case 1)"
    release:
      namespace: "foo"
    set:
      server.ha.enabled: true
    asserts:
      - equal:
          path: metadata.namespace
          value: "foo"

  - it: "server/DisruptionBudget: namespace (case 2)"
    release:
      namespace: "foo"
    set:
      server.ha.enabled: true
      global.namespace: "bar"
    asserts:
      - equal:
          path: metadata.namespace
          value: "bar"

  - it: "server/DisruptionBudget: correct maxUnavailable with n=1"
    set:
      server.ha.enabled: true
      server.ha.replicas: 1
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 0

  - it: "server/DisruptionBudget: correct maxUnavailable with n=3"
    set:
      server.ha.enabled: true
      server.ha.replicas: 3
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 1

  - it: "server/DisruptionBudget: correct maxUnavailable with n=5"
    set:
      server.ha.enabled: true
      server.ha.replicas: 5
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 2

  - it: "server/DisruptionBudget: correct maxUnavailable with custom value"
    set:
      server.ha.enabled: true
      server.ha.replicas: 3
      server.ha.disruptionBudget.maxUnavailable: 2
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 2
