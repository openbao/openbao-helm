suite: OpenBao Server Discovery Rolebinding Test
templates:
  - templates/server-discovery-rolebinding.yaml
release:
  name: "release-name"
  namespace: "default"
tests:
  - it: "server/DiscoveryRoleBinding: enabled by default with ha (case 1)"
    asserts:
      - hasDocuments:
          count: 0

  - it: "server/DiscoveryRoleBinding: enabled by default with ha (case 2)"
    set:
      server.ha.enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: "server/DiscoveryRoleBinding: can disable with server.enabled false"
    set:
      server.enabled: false
      server.ha.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: "server/DiscoveryRoleBinding: can disable with server.serviceAccount.serviceDiscovery.enabled false"
    set:
      server.ha.enabled: true
      server.serviceAccount.serviceDiscovery.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: "server/DiscoveryRoleBinding: namespace (case 1)"
    release:
      namespace: "foo"
    set:
      server.ha.enabled: true
    asserts:
      - equal:
          path: metadata.namespace
          value: "foo"

  - it: "server/DiscoveryRoleBinding: namespace (case 2)"
    release:
      namespace: "foo"
    set:
      server.ha.enabled: true
      global.namespace: "bar"
    asserts:
      - equal:
          path: metadata.namespace
          value: "bar"
