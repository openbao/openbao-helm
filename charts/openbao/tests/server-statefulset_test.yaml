suite: OpenBao Server Statefulset Test
templates:
  - templates/server-statefulset.yaml
release:
  name: "release-name"
  namespace: "default"
tests:
  - it: "server/StatefulSet: disabled server.enabled"
    set:
      server.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: "server/StatefulSet: disabled server.enabled random string"
    set:
      server.enabled: "blabla"
    asserts:
      - hasDocuments:
          count: 0

  - it: "server/StatefulSet: enabled server.enabled explicit true"
    set:
      server.enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: "server/standalone-StatefulSet: default server.standalone.enabled"
    asserts:
      - hasDocuments:
          count: 1

  - it: "server/standalone-StatefulSet: enable with server.standalone.enabled true"
    set:
      server.standalone.enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: "server/standalone-StatefulSet: disable with global.enabled"
    set:
      global.enabled: false
      server.standalone.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: "server/standalone-StatefulSet: disable with global.externalVaultAddr"
    set:
      global.externalVaultAddr: "http://openbao-outside"
      server.standalone.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: "server/standalone-StatefulSet: namespace (case 1)"
    release:
      namespace: "foo"
    set:
      server.standalone.enabled: true
    asserts:
      - equal:
          path: metadata.namespace
          value: "foo"

  - it: "server/standalone-StatefulSet: namespace (case 2)"
    release:
      namespace: "foo"
    set:
      server.standalone.enabled: true
      global.namespace: "bar"
    asserts:
      - equal:
          path: metadata.namespace
          value: "bar"

  - it: "server/standalone-StatefulSet: image defaults to server.image.repository:tag (case 1)"
    set:
      server.image.repository: "foo"
      server.image.tag: "1.2.3"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "quay.io/foo:1.2.3"

  - it: "server/standalone-StatefulSet: image defaults to server.image.repository:tag (case 2)"
    set:
      server.image.repository: "foo"
      server.image.tag: "1.2.3"
      server.standalone.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "quay.io/foo:1.2.3"

  - it: "server/standalone-StatefulSet: image tag defaults to appVersion (case 1)"
    set:
      server.image.repository: "foo"
      server.image.tag: ""
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "quay.io/foo:2.7.2"

  - it: "server/standalone-StatefulSet: image tag defaults to appVersion (case 2)"
    set:
      server.image.repository: "foo"
      server.image.tag: ""
      server.standalone.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "quay.io/foo:2.7.2"

  - it: "server/standalone-StatefulSet: default imagePullPolicy"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: "IfNotPresent"

  - it: "server/standalone-StatefulSet: Custom imagePullPolicy"
    set:
      server.image.pullPolicy: "Always"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: "Always"

  - it: "server/standalone-StatefulSet: Custom imagePullSecrets"
    set:
      global:
        imagePullSecrets:
          - name: "foo"
          - name: "bar"
    asserts:
      - lengthEqual:
          path: spec.template.spec.imagePullSecrets
          count: 2
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: "foo"
      - equal:
          path: spec.template.spec.imagePullSecrets[1].name
          value: "bar"

  - it: "server/standalone-StatefulSet: Custom imagePullSecrets - string array"
    set:
      global:
        imagePullSecrets:
          - "foo"
          - "bar"
    asserts:
      - lengthEqual:
          path: spec.template.spec.imagePullSecrets
          count: 2
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: "foo"
      - equal:
          path: spec.template.spec.imagePullSecrets[1].name
          value: "bar"

  - it: "server/standalone-StatefulSet: default imagePullSecrets"
    asserts:
      - isNull:
          path: spec.template.spec.imagePullSecrets

  - it: "server/standalone-StatefulSet: OnDelete updateStrategy"
    asserts:
      - equal:
          path: spec.updateStrategy.type
          value: "OnDelete"

  - it: "server/standalone-StatefulSet: default replicas"
    set:
      server.standalone.enabled: true
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: "server/standalone-StatefulSet: custom replicas (case 1)"
    set:
      server.standalone.replicas: 100
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: "server/standalone-StatefulSet: custom replicas (case 2)"
    set:
      server.standalone.enabled: true
      server.standalone.replicas: 100
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: "server/standalone-StatefulSet: default resources"
    set:
      server.standalone.enabled: true
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].resources

  - it: "server/standalone-StatefulSet: custom resources (case 1)"
    set:
      server.standalone.enabled: true
      server.resources.requests.memory: "256Mi"
      server.resources.requests.cpu: "250m"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: "256Mi"

  - it: "server/standalone-StatefulSet: custom resources (case 2)"
    set:
      server.standalone.enabled: true
      server.resources.limits.memory: "256Mi"
      server.resources.limits.cpu: "250m"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: "256Mi"

  - it: "server/standalone-StatefulSet: custom resources (case 3)"
    set:
      server.standalone.enabled: true
      server.resources.requests.cpu: "250m"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "250m"

  - it: "server/standalone-StatefulSet: custom resources (case 4)"
    set:
      server.standalone.enabled: true
      server.resources.limits.cpu: "250m"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "250m"

  - it: "server/standalone-StatefulSet: server.extraVolumes adds extra volume (case 1)"
    set:
      server:
        extraVolumes:
          - type: "configMap"
            name: "foo"
    asserts:
      - equal:
          path: spec.template.spec.volumes[?(@.name == "userconfig-foo")].configMap.name
          value: "foo"
      - isNull:
          path: spec.template.spec.volumes[?(@.name == "userconfig-foo")].configMap.secretName

  - it: "server/standalone-StatefulSet: server.extraVolumes adds extra volume (case 2)"
    set:
      server.standalone.enabled: true
      server:
        extraVolumes:
          - type: "configMap"
            name: "foo"
    asserts:
      - equal:
          path: spec.template.spec.volumes[?(@.name == "userconfig-foo")].configMap.name
          value: "foo"
      - isNull:
          path: spec.template.spec.volumes[?(@.name == "userconfig-foo")].configMap.secretName

  - it: "server/standalone-StatefulSet: server.extraVolumes adds extra volume (case 3)"
    set:
      server:
        extraVolumes:
          - type: "configMap"
            name: "foo"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "userconfig-foo")].readOnly
          value: true
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "userconfig-foo")].mountPath
          value: "/openbao/userconfig/foo"

  - it: "server/standalone-StatefulSet: server.extraVolumes adds extra volume (case 4)"
    set:
      server.standalone.enabled: true
      server:
        extraVolumes:
          - type: "configMap"
            name: "foo"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "userconfig-foo")].readOnly
          value: true
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "userconfig-foo")].mountPath
          value: "/openbao/userconfig/foo"

  - it: "server/standalone-StatefulSet: server.extraVolumes adds extra secret volume (case 1)"
    set:
      server:
        extraVolumes:
          - type: "secret"
            name: "foo"
    asserts:
      - isNull:
          path: spec.template.spec.volumes[?(@.name == "userconfig-foo")].secret.name
      - equal:
          path: spec.template.spec.volumes[?(@.name == "userconfig-foo")].secret.secretName
          value: "foo"

  - it: "server/standalone-StatefulSet: server.extraVolumes adds extra secret volume (case 2)"
    set:
      server.standalone.enabled: true
      server:
        extraVolumes:
          - type: "secret"
            name: "foo"
    asserts:
      - isNull:
          path: spec.template.spec.volumes[?(@.name == "userconfig-foo")].secret.name
      - equal:
          path: spec.template.spec.volumes[?(@.name == "userconfig-foo")].secret.secretName
          value: "foo"

  - it: "server/standalone-StatefulSet: server.extraVolumes adds extra secret volume (case 3)"
    set:
      server:
        extraVolumes:
          - type: "configMap"
            name: "foo"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "userconfig-foo")].readOnly
          value: true
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "userconfig-foo")].mountPath
          value: "/openbao/userconfig/foo"

  - it: "server/standalone-StatefulSet: server.extraVolumes adds extra secret volume (case 4)"
    set:
      server.standalone.enabled: true
      server:
        extraVolumes:
          - type: "configMap"
            name: "foo"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "userconfig-foo")].readOnly
          value: true
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "userconfig-foo")].mountPath
          value: "/openbao/userconfig/foo"

  - it: "server/standalone-StatefulSet: can mount audit"
    set:
      server.auditStorage.enabled: true
    asserts:
      - isNotNull:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "audit")]

  - it: "server/standalone-StatefulSet: server.volumes adds volume"
    set:
      server:
        volumes:
          - name: "plugins"
            emptyDir: {}
    asserts:
      - equal:
          path: spec.template.spec.volumes[?(@.name == "plugins")].emptyDir
          value: {}

  - it: "server/standalone-StatefulSet: server.volumeMounts adds volumeMount"
    set:
      server:
        volumeMounts:
          - name: "plugins"
            mountPath: "/usr/local/libexec/vault"
            readOnly: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "plugins")].mountPath
          value: "/usr/local/libexec/vault"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "plugins")].readOnly
          value: true

  - it: "server/standalone-StatefulSet: default log level to empty"
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "BAO_LOG_LEVEL")].name

  - it: "server/standalone-StatefulSet: log level can be changed"
    set:
      server.logLevel: "debug"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "BAO_LOG_LEVEL")].value
          value: "debug"

  - it: "server/standalone-StatefulSet: default log format to empty"
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "BAO_LOG_FORMAT")].name

  - it: "server/standalone-StatefulSet: can set log format"
    set:
      server.logFormat: "json"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "BAO_LOG_FORMAT")].value
          value: "json"

  - it: "server/standalone-StatefulSet: set extraEnvironmentVars (case 1)"
    set:
      server.standalone.enabled: true
      server.extraEnvironmentVars.FOO: "bar"
      server.extraEnvironmentVars.FOOBAR: "foobar"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "FOO")].value
          value: "bar"
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "FOOBAR")].value
          value: "foobar"

  - it: "server/standalone-StatefulSet: set extraEnvironmentVars (case 2)"
    set:
      server.extraEnvironmentVars.FOO: "bar"
      server.extraEnvironmentVars.FOOBAR: "foobar"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "FOO")].value
          value: "bar"
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "FOOBAR")].value
          value: "foobar"

  - it: "server/standalone-StatefulSet: storageClass on claim by default (case 1)"
    asserts:
      - isNull:
          path: spec.volumeClaimTemplates[0].spec.storageClassName

  - it: "server/standalone-StatefulSet: storageClass on claim by default (case 2)"
    set:
      server.standalone.enabled: true
    asserts:
      - isNull:
          path: spec.volumeClaimTemplates[0].spec.storageClassName

  - it: "server/standalone-StatefulSet: can set storageClass (case 1)"
    set:
      server.dataStorage.enabled: true
      server.dataStorage.storageClass: "foo"
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
          value: "foo"

  - it: "server/standalone-StatefulSet: can set storageClass (case 2)"
    set:
      server.standalone.enabled: true
      server.dataStorage.enabled: false
      server.auditStorage.enabled: true
      server.auditStorage.storageClass: "foo"
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
          value: "foo"

  - it: "server/standalone-StatefulSet: can set storageClass (case 3)"
    set:
      server.standalone.enabled: true
      server.auditStorage.enabled: true
      server.auditStorage.storageClass: "foo"
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[1].spec.storageClassName
          value: "foo"

  - it: "server/standalone-StatefulSet: can set storageClass (case 4)"
    set:
      server.auditStorage.enabled: true
      server.dataStorage.enabled: true
    asserts:
      - lengthEqual:
          path: spec.volumeClaimTemplates
          count: 2

  - it: "server/standalone-StatefulSet: can set storageClass (case 5)"
    set:
      server.standalone.enabled: true
      server.auditStorage.enabled: true
      server.dataStorage.enabled: true
    asserts:
      - lengthEqual:
          path: spec.volumeClaimTemplates
          count: 2

  - it: "server/standalone-StatefulSet: can disable storage (case 1)"
    set:
      server.auditStorage.enabled: false
      server.dataStorage.enabled: true
    asserts:
      - lengthEqual:
          path: spec.volumeClaimTemplates
          count: 1

  - it: "server/standalone-StatefulSet: can disable storage (case 2)"
    set:
      server.auditStorage.enabled: true
      server.dataStorage.enabled: false
    asserts:
      - lengthEqual:
          path: spec.volumeClaimTemplates
          count: 1

  - it: "server/standalone-StatefulSet: can disable storage (case 3)"
    set:
      server.standalone.enabled: true
      server.auditStorage.enabled: false
      server.dataStorage.enabled: true
    asserts:
      - lengthEqual:
          path: spec.volumeClaimTemplates
          count: 1

  - it: "server/standalone-StatefulSet: can disable storage (case 4)"
    set:
      server.standalone.enabled: true
      server.auditStorage.enabled: true
      server.dataStorage.enabled: false
    asserts:
      - lengthEqual:
          path: spec.volumeClaimTemplates
          count: 1

  - it: "server/standalone-StatefulSet: can disable storage (case 5)"
    set:
      server.auditStorage.enabled: true
      server.dataStorage.enabled: true
    asserts:
      - lengthEqual:
          path: spec.volumeClaimTemplates
          count: 2

  - it: "server/standalone-StatefulSet: can disable storage (case 6)"
    set:
      server.standalone.enabled: true
      server.auditStorage.enabled: true
      server.dataStorage.enabled: true
    asserts:
      - lengthEqual:
          path: spec.volumeClaimTemplates
          count: 2

  - it: "server/standalone-StatefulSet: can disable storage (case 7)"
    set:
      server.auditStorage.enabled: "fa;se"
      server.dataStorage.enabled: false
    asserts:
      - lengthEqual:
          path: spec.volumeClaimTemplates
          count: 0

  - it: "server/standalone-StatefulSet: can disable storage (case 8)"
    set:
      server.standalone.enabled: true
      server.auditStorage.enabled: false
      server.dataStorage.enabled: false
    asserts:
      - notExists:
          path: spec.volumeClaimTemplates

  - it: "server/standalone-StatefulSet: default audit storage mount path"
    set:
      server.auditStorage.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "audit")].mountPath
          value: "/openbao/audit"

  - it: "server/standalone-StatefulSet: can configure audit storage mount path"
    set:
      server.auditStorage.enabled: true
      server.auditStorage.mountPath: "/var/log/vault"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "audit")].mountPath
          value: "/var/log/vault"

  - it: "server/standalone-StatefulSet: default data storage mount path"
    set:
      server.dataStorage.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "data")].mountPath
          value: "/openbao/data"

  - it: "server/standalone-StatefulSet: can configure data storage mount path"
    set:
      server.dataStorage.enabled: true
      server.dataStorage.mountPath: "/opt/vault"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "data")].mountPath
          value: "/opt/vault"

  - it: "server/standalone-StatefulSet: affinity is set by default"
    asserts:
      - isNotNull:
          path: spec.template.spec.affinity["podAntiAffinity"]

  - it: "server/standalone-StatefulSet: affinity can be set as string"
    set:
      server.affinity: "foobar"
    asserts:
      - equal:
          path: spec.template.spec.affinity
          value: "foobar"

  - it: "server/standalone-StatefulSet: affinity can be set as YAML"
    set:
      server.affinity.podAntiAffinity: "foobar"
    asserts:
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity
          value: "foobar"

  - it: "server/standalone-StatefulSet: topologySpreadConstraints is null by default"
    asserts:
      - isNull:
          path: spec.template.spec.topologySpreadConstraints

  - it: "server/standalone-StatefulSet: topologySpreadConstraints can be set as YAML"
    set:
      server:
        topologySpreadConstraints:
          - foo: "bar"
          - baz: "qux"
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints
          value: [{"foo":"bar"},{"baz":"qux"}]

  - it: "server/standalone-StatefulSet: tolerations not set by default"
    asserts:
      - isNull:
          path: spec.template.spec.tolerations

  - it: "server/standalone-StatefulSet: tolerations can be set as string"
    set:
      server.tolerations: "foobar"
    asserts:
      - equal:
          path: spec.template.spec.tolerations
          value: "foobar"

  - it: "server/standalone-StatefulSet: tolerations can be set as YAML"
    set:
      server:
        tolerations:
          - foo: "bar"
          - baz: "qux"
    asserts:
      - equal:
          path: spec.template.spec.tolerations
          value: [{"foo":"bar"},{"baz":"qux"}]

  - it: "server/standalone-StatefulSet: nodeSelector is not set by default"
    asserts:
      - isNull:
          path: spec.template.spec.nodeSelector

  - it: "server/standalone-StatefulSet: specified nodeSelector as string"
    set:
      server.nodeSelector: "testing"
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value: "testing"

  - it: "server/standalone-StatefulSet: nodeSelector can be set as YAML"
    set:
      server:
        nodeSelector:
          "beta.kubernetes.io/arch": "amd64"
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value: {"beta.kubernetes.io/arch":"amd64"}

  - it: "server/standalone-StatefulSet: adds extra init containers"
    set:
      server:
        extraInitContainers:
          - image: "test-image"
            name: "test-container"
            ports:
              - name: "test-port"
                containerPort: 9410
                protocol: "TCP"
            env:
              - name: "TEST_ENV"
                value: "test_env_value"
    asserts:
      - equal:
          path: spec.template.spec.initContainers[?(@.name == "test-container")].name
          value: "test-container"
      - equal:
          path: spec.template.spec.initContainers[?(@.name == "test-container")].image
          value: "test-image"
      - equal:
          path: spec.template.spec.initContainers[?(@.name == "test-container")].ports[0].name
          value: "test-port"
      - equal:
          path: spec.template.spec.initContainers[?(@.name == "test-container")].ports[0].containerPort
          value: 9410
      - equal:
          path: spec.template.spec.initContainers[?(@.name == "test-container")].ports[0].protocol
          value: "TCP"
      - equal:
          path: spec.template.spec.initContainers[?(@.name == "test-container")].env[0].name
          value: "TEST_ENV"
      - equal:
          path: spec.template.spec.initContainers[?(@.name == "test-container")].env[0].value
          value: "test_env_value"

  - it: "server/standalone-StatefulSet: add two extra init containers"
    set:
      server:
        extraInitContainers:
          - image: "test-image"
            name: "test-container"
          - image: "test-image"
            name: "test-container-2"
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 2

  - it: "server/standalone-StatefulSet: adds extra containers"
    set:
      server:
        extraContainers:
          - image: "test-image"
            name: "test-container"
            ports:
              - name: "test-port"
                containerPort: 9410
                protocol: "TCP"
            env:
              - name: "TEST_ENV"
                value: "test_env_value"
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "test-container")].name
          value: "test-container"
      - equal:
          path: spec.template.spec.containers[?(@.name == "test-container")].image
          value: "test-image"
      - equal:
          path: spec.template.spec.containers[?(@.name == "test-container")].ports[0].name
          value: "test-port"
      - equal:
          path: spec.template.spec.containers[?(@.name == "test-container")].ports[0].containerPort
          value: 9410
      - equal:
          path: spec.template.spec.containers[?(@.name == "test-container")].ports[0].protocol
          value: "TCP"
      - equal:
          path: spec.template.spec.containers[?(@.name == "test-container")].env[0].name
          value: "TEST_ENV"
      - equal:
          path: spec.template.spec.containers[?(@.name == "test-container")].env[0].value
