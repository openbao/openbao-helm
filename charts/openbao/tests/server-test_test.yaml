suite: OpenBao Server Test Test
templates:
  - templates/tests/server-test.yaml
release:
  name: "release-name"
  namespace: "default"
tests:
  - it: "server/server-test-Pod: disabled server.enabled"
    set:
      server.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: "server/server-test-Pod: disabled server.enabled random string"
    set:
      server.enabled: "blabla"
    asserts:
      - hasDocuments:
          count: 0

  - it: "server/server-test-Pod: enabled server.enabled explicit true"
    set:
      server.enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: "server/standalone-server-test-Pod: default metadata.name"
    asserts:
      - equal:
          path: metadata.name
          value: "release-name-openbao-server-test"

  - it: "server/standalone-server-test-Pod: release metadata.name vault"
    asserts:
      - equal:
          path: metadata.name
          value: "openbao-server-test"

  - it: "server/standalone-server-test-Pod: release metadata.name foo"
    asserts:
      - equal:
          path: metadata.name
          value: "foo-openbao-server-test"

  - it: "server/standalone-server-test-Pod: default server.standalone.enabled"
    asserts:
      - hasDocuments:
          count: 1

  - it: "server/standalone-server-test-Pod: enable with server.standalone.enabled true"
    set:
      server.standalone.enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: "server/ha-server-test-Pod: enable with server.ha.enabled true"
    set:
      server.ha.enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: "server/standalone-server-test-Pod: not disabled with global.enabled"
    set:
      global.enabled: false
      server.enabled: true
      server.standalone.enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: "server/standalone-server-test-Pod: disable with global.enabled"
    set:
      global.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: "server/standalone-server-test-Pod: disable with global.externalVaultAddr"
    set:
      global.externalVaultAddr: "http://openbao-outside"
      server.standalone.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: "server/standalone-server-test-Pod: image defaults to server.image.repository:tag (case 1)"
    set:
      server.image.repository: "foo"
      server.image.tag: "1.2.3"
    asserts:
      - equal:
          path: spec.containers[0].image
          value: "quay.io/foo:1.2.3"

  - it: "server/standalone-server-test-Pod: image defaults to server.image.repository:tag (case 2)"
    set:
      server.image.repository: "foo"
      server.image.tag: "1.2.3"
      server.standalone.enabled: true
    asserts:
      - equal:
          path: spec.containers[0].image
          value: "quay.io/foo:1.2.3"

  - it: "server/standalone-server-test-Pod: image tag defaults to appVersion (case 1)"
    set:
      server.image.repository: "foo"
      server.image.tag: ""
    asserts:
      - equal:
          path: spec.containers[0].image
          value: "quay.io/foo:2.7.2"

  - it: "server/standalone-server-test-Pod: image tag defaults to appVersion (case 2)"
    set:
      server.image.repository: "foo"
      server.image.tag: ""
      server.standalone.enabled: true
    asserts:
      - equal:
          path: spec.containers[0].image
          value: "quay.io/foo:2.7.2"

  - it: "server/standalone-server-test-Pod: default imagePullPolicy"
    asserts:
      - equal:
          path: spec.containers[0].imagePullPolicy
          value: "IfNotPresent"

  - it: "server/standalone-server-test-Pod: Custom imagePullPolicy"
    set:
      server.image.pullPolicy: "Always"
    asserts:
      - equal:
          path: spec.containers[0].imagePullPolicy
          value: "Always"

  - it: "server/standalone-server-test-Pod: default resources"
    set:
      server.standalone.enabled: true
    asserts:
      - isNull:
          path: spec.containers[0].resources

  - it: "server/standalone-server-test-Pod: server.volumes adds volume"
    set:
      server:
        volumes:
          - name: "plugins"
            emptyDir: {}
    asserts:
      - equal:
          path: spec.volumes[?(@.name == "plugins")].emptyDir
          value: {}

  - it: "server/standalone-server-test-Pod: server.volumeMounts adds volumeMount"
    set:
      server:
        volumeMounts:
          - name: "plugins"
            mountPath: "/usr/local/libexec/vault"
            readOnly: true
    asserts:
      - equal:
          path: spec.containers[0].volumeMounts[?(@.name == "plugins")].mountPath
          value: "/usr/local/libexec/vault"
      - equal:
          path: spec.containers[0].volumeMounts[?(@.name == "plugins")].readOnly
          value: true

  - it: "server/standalone-server-test-Pod: set extraEnvironmentVars (case 1)"
    set:
      server.standalone.enabled: true
      server.extraEnvironmentVars.FOO: "bar"
      server.extraEnvironmentVars.FOOBAR: "foobar"
    asserts:
      - equal:
          path: spec.containers[0].env[?(@.name == "FOO")].value
          value: "bar"
      - equal:
          path: spec.containers[0].env[?(@.name == "FOOBAR")].value
          value: "foobar"

  - it: "server/standalone-server-test-Pod: set extraEnvironmentVars (case 2)"
    set:
      server.extraEnvironmentVars.FOO: "bar"
      server.extraEnvironmentVars.FOOBAR: "foobar"
    asserts:
      - equal:
          path: spec.containers[0].env[?(@.name == "FOO")].value
          value: "bar"
      - equal:
          path: spec.containers[0].env[?(@.name == "FOOBAR")].value
          value: "foobar"
