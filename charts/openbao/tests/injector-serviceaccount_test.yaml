suite: OpenBao Injector Serviceaccount Test
templates:
  - templates/injector-serviceaccount.yaml
release:
  name: "release-name"
  namespace: "default"
tests:
  - it: "injector/ServiceAccount: enabled by default"
    asserts:
      - hasDocuments:
          count: 1

  - it: "injector/ServiceAccount: disable with global.enabled"
    set:
      global:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: "injector/ServiceAccount: namespace (case 1)"
    release:
      namespace: "foo"
    asserts:
      - equal:
          path: metadata.namespace
          value: "foo"

  - it: "injector/ServiceAccount: namespace (case 2)"
    release:
      namespace: "foo"
    set:
      global:
        namespace: "bar"
    asserts:
      - equal:
          path: metadata.namespace
          value: "bar"

  - it: "injector/ServiceAccount: generic annotations"
    set:
      injector:
        serviceAccount:
          annotations: "openBaoIsAwesome: true"
    asserts:
      - equal:
          path: metadata.annotations["openBaoIsAwesome"]
          value: true
