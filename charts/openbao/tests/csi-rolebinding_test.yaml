suite: OpenBao CSI RoleBinding Test
templates:
  - templates/csi-rolebinding.yaml
release:
  name: release-name
  namespace: foo
tests:
  - it: is not rendered by default
    asserts:
      - hasDocuments:
          count: 0

  - it: uses the expected name and references
    set:
      csi.enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: release-name-openbao-csi-provider-rolebinding
      - equal:
          path: roleRef.name
          value: release-name-openbao-csi-provider-role
      - equal:
          path: subjects[0].name
          value: release-name-openbao-csi-provider
      - equal:
          path: subjects[0].namespace
          value: foo
      - equal:
          path: metadata.namespace
          value: foo

  - it: allows the global namespace to override the release namespace
    set:
      csi.enabled: true
      global.namespace: bar
    asserts:
      - equal:
          path: metadata.namespace
          value: bar
