suite: OpenBao CSI ServiceAccount Test
templates:
  - templates/csi-serviceaccount.yaml
release:
  name: release-name
  namespace: foo
tests:
  - it: is not rendered by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders with the expected defaults when CSI is enabled
    set:
      csi.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: release-name-openbao-csi-provider
      - equal:
          path: metadata.namespace
          value: foo
      - isNull:
          path: metadata.annotations["foo"]

  - it: allows the global namespace to override the release namespace
    set:
      csi.enabled: true
      global.namespace: bar
    asserts:
      - equal:
          path: metadata.namespace
          value: bar

  - it: supports annotations as YAML
    set:
      csi.enabled: true
      csi.serviceAccount.annotations:
        foo: bar
    asserts:
      - equal:
          path: metadata.annotations["foo"]
          value: bar

  - it: supports annotations as a YAML string
    set:
      csi.enabled: true
      csi.serviceAccount.annotations: "foo: bar"
    asserts:
      - equal:
          path: metadata.annotations["foo"]
          value: bar

  - it: supports extra labels
    set:
      csi.enabled: true
      csi.serviceAccount.extraLabels.foo: bar
    asserts:
      - equal:
          path: metadata.labels.foo
          value: bar
