suite: OpenBao CSI ServiceAccount Test
templates:
  - templates/csi-serviceaccount.yaml
  - templates/server-serviceaccount.yaml
release:
  name: release-name
  namespace: foo
tests:
  - it: is not rendered by default
    template: templates/csi-serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: is rendered when CSI is enabled
    template: templates/csi-serviceaccount.yaml
    set:
      csi.enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: uses the expected name
    template: templates/csi-serviceaccount.yaml
    set:
      csi.enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: release-name-openbao-csi-provider

  - it: uses the release namespace
    template: templates/csi-serviceaccount.yaml
    set:
      csi.enabled: true
    asserts:
      - equal:
          path: metadata.namespace
          value: foo

  - it: allows the global namespace to override the release namespace
    template: templates/csi-serviceaccount.yaml
    set:
      csi.enabled: true
      global.namespace: bar
    asserts:
      - equal:
          path: metadata.namespace
          value: bar

  - it: does not set annotations on the server ServiceAccount by default
    template: templates/server-serviceaccount.yaml
    set:
      csi.enabled: true
    asserts:
      - isNull:
          path: metadata.annotations["foo"]

  - it: does not apply CSI annotations to the server ServiceAccount
    template: templates/server-serviceaccount.yaml
    set:
      csi.enabled: true
      csi.serviceAccount.annotations: "foo: bar"
    asserts:
      - isNull:
          path: metadata.annotations["foo"]

  - it: applies server annotations to the server ServiceAccount
    template: templates/server-serviceaccount.yaml
    set:
      csi.enabled: true
      server.serviceAccount.annotations.foo: bar
    asserts:
      - equal:
          path: metadata.annotations["foo"]
          value: bar

  - it: supports extra labels
    template: templates/csi-serviceaccount.yaml
    set:
      csi.enabled: true
      csi.serviceAccount.extraLabels.foo: bar
    asserts:
      - equal:
          path: metadata.labels.foo
          value: bar
