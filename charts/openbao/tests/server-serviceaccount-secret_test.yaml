suite: OpenBao Server Serviceaccount Secret Test
templates:
  - templates/server-serviceaccount-secret.yaml
release:
  name: "release-name"
  namespace: "default"
tests:
  - it: "server/ServiceAccountSecret: verify service account name match (case 1)"
    set:
      server.dev.enabled: true
      server.serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: "server/ServiceAccountSecret: verify service account name match (case 2)"
    set:
      server.dev.enabled: true
      server.serviceAccount.name: "user-defined-ksa"
      server.serviceAccount.createSecret: true
    asserts:
      - equal:
          path: metadata.name
          value: "user-defined-ksa-token"

  - it: "server/ServiceAccountSecret: verify service account name match (case 3)"
    set:
      server.dev.enabled: true
      server.serviceAccount.createSecret: true
    asserts:
      - equal:
          path: metadata.name
          value: "release-name-openbao-token"

  - it: "server/ServiceAccountSecret: annotation mapping to service account (case 1)"
    set:
      server.dev.enabled: true
      server.serviceAccount.name: "user-defined-ksa"
      server.serviceAccount.createSecret: true
    asserts:
      - equal:
          path: metadata.annotations["kubernetes.io/service-account.name"]
          value: "user-defined-ksa"

  - it: "server/ServiceAccountSecret: annotation mapping to service account (case 2)"
    set:
      server.dev.enabled: true
      server.serviceAccount.createSecret: true
    asserts:
      - equal:
          path: metadata.annotations["kubernetes.io/service-account.name"]
          value: "release-name-openbao"

  - it: "server/ServiceAccountSecret: namespace (case 1)"
    release:
      namespace: "foo"
    set:
      server.serviceAccount.create: true
      server.serviceAccount.createSecret: true
    asserts:
      - equal:
          path: metadata.namespace
          value: "foo"

  - it: "server/ServiceAccountSecret: namespace (case 2)"
    release:
      namespace: "foo"
    set:
      server.serviceAccount.create: true
      server.serviceAccount.createSecret: true
      global.namespace: "bar"
    asserts:
      - equal:
          path: metadata.namespace
          value: "bar"
